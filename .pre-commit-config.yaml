exclude: ^\.codex/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Healing replay fixtures ship real device screenshots
        # (≈700KB-3MB each); the cap is sized for those. The fixture
        # set is bounded — not unbounded growth.
        args: ['--maxkb=4096']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.0.0, pydantic-settings>=2.0.0, types-setuptools, lark>=1.1.9, types-PyYAML]
        args: [--strict, --ignore-missing-imports]
        exclude: ^tests/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # Architecture-fitness checker. The rollout mode lives in governance/debt.json, not a flag:
  # REPORT (Phase 0a) always exits 0; set it to RATCHET (Phase 0b) to fail on any blocking
  # disposition once the baseline is governance-approved.
  - repo: local
    hooks:
      - id: architecture-fitness
        name: architecture fitness
        entry: python -m governance
        language: python
        additional_dependencies: ["pydantic>=2.0.0"]
        pass_filenames: false
        always_run: true

      # Strict typing for the governance slice, which the global mypy hook excludes with tests/.
      - id: mypy-governance
        name: mypy (governance slice, strict)
        entry: mypy
        language: python
        additional_dependencies: ["mypy>=1.19.0", "pydantic>=2.0.0"]
        files: ^(governance/|tests/architecture/|tests/unit/governance/).*\.py$
        pass_filenames: true
