[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fathom"
version = "0.1.0"
readme = "README.md"
description = "Vision-driven agent orchestration framework for UI crawling"

license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Drizz", email = "tech@drizz.dev" },
]
keywords = [
    "ui",
    "llm",
    "app",
    "agent",
    "vision",
    "testing",
    "crawler",
    "automation",
    "orchestration",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4.2",
    "httpx>=0.28.1",
    "PyYAML>=6.0.0",
    "rich>=14.3.2",
    "Pillow>=12.1.0",
    "pydantic>=2.0.0",
    "tenacity>=9.0.0",
    "aiosqlite>=0.20.0",
    "opencv-python>=4.13.0.92",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "structlog>=23.0.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.2.0",
    "google-cloud-storage>=2.0.0",
    "types-PyYAML>=6.0.12.20250915",
    "rustworkx>=0.15.0",
    "langgraph>=0.0.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "questionary>=2.0.0",
    "textual>=0.70.0"
]

[project.scripts]
fathom = "fathom.cli:main"
Drizz = "fathom.cli:main"

[project.optional-dependencies]
gemini = [
    "google-generativeai>=0.3.0",
]
temporal = [
    "temporalio>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]
all = [
    "fathom[gemini,temporal,dev]",
]

[project.urls]
Homepage = "https://github.com/DrizzDev/fathom"
Repository = "https://github.com/DrizzDev/fathom"
Issues = "https://github.com/DrizzDev/fathom/issues"
Documentation = "https://github.com/DrizzDev/fathom#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "TC001",  # move application import into TYPE_CHECKING block
    "TC002",  # move third-party import into TYPE_CHECKING block
    "ARG002", # unused argument (needed for mock interfaces)
    "UP006",  # use list/dict instead of List/Dict (User preference)
    "UP007",  # use X | Y instead of Union/Optional (User preference)
    "UP035",  # use builtin types (User preference)
]

# Architectural boundary enforcement
# Note: These rules are documented here but enforcement is manual via code review
# Ruff's flake8-tidy-imports doesn't support complex allowed-in patterns
#
# Rules:
# 1. Core layer (core/) cannot import from adapters/
# 2. Interfaces layer (interfaces/) can only import from schemas/
# 3. Strategies (strategies/) should receive ports via dependency injection
# 4. Adapters (adapters/) can import from anywhere (they're at the edge)
# 5. Processing (processing/) can only import from schemas/ and utils/
# 6. Runtime (runtime/) wires everything together and can import adapters

[tool.ruff.lint.isort]
known-first-party = ["fathom"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/fathom"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
